name: Test, Deploy & Release

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Format Check
        run: cargo fmt --all -- --check

      - name: Optimization Check
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Functionality Test
        run: cargo test --all-targets --all-features --locked

  build_web:
    needs: validate
    if: ${{ !contains(github.event.head_commit.message, 'wip') && !contains(github.event.head_commit.message, 'WIP') && !startsWith(github.ref, 'refs/tags/')}}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release
        env:
          RUSTFLAGS: "-C link-arg=--import-undefined"
        run: cargo build --target wasm32-unknown-unknown --release --locked

      - name: Prepare Deployment Directory
        run: |
          mkdir -p dist
          cp index.html dist/
          cp target/wasm32-unknown-unknown/release/autonomous_path_architect.wasm dist/

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy_pages:
    needs: build_web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  build_desktop:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact_name: autonomous_path_architect
          - os: windows-latest
            target: windows
            artifact_name: autonomous_path_architect.exe
          - os: macos-26
            target: macos
            artifact_name: autonomous_path_architect
          - os: macos-26-intel
            target: macos-intel
            artifact_name: autonomous_path_architect
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release
        run: cargo build --release --locked

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: target/release/${{ matrix.artifact_name }}

  deploy_releases:
    needs: build_desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: tmp_artifacts

      - name: Structure Release Assets
        run: |
          mkdir -p release_assets
          cp tmp_artifacts/bin-linux/autonomous_path_architect release_assets/autonomous_path_architect-linux
          cp tmp_artifacts/bin-windows/autonomous_path_architect.exe release_assets/autonomous_path_architect.exe
          cp tmp_artifacts/bin-macos/autonomous_path_architect release_assets/autonomous_path_architect-macos
          cp tmp_artifacts/bin-macos-intel/autonomous_path_architect release_assets/autonomous_path_architect-macos-intel

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release_assets/autonomous_path_architect-linux
            release_assets/autonomous_path_architect.exe
            release_assets/autonomous_path_architect-macos
            release_assets/autonomous_path_architect-macos-intel

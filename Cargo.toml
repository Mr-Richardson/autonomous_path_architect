[package]
name = "autonomous_path_architect"
version = "0.0.3"
edition = "2024"
authors = ["Mr Richardson"]
description = "Easily construct your robots drive-path in the digital world."
documentation = "https://docs.rs/autonomous_path_architect" # TODO: write docs and set up docs.rs
readme = "README.md" # TODO: Write proper readme
license = "GNU General Public License v3.0"
repository = "https://github.com/Mr-Richardson/autonomous_path_architect"
keywords = ["robotics", "macroquad", "tool"]
categories = ["science::robotics", "simulation", "rendering::engine"]

[dependencies]
button_lib = "0.1.0"
macroquad = "0.4.15"
miniquad = "0.4.10"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = "3.6.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Clipboard", "Window", "Navigator"] }

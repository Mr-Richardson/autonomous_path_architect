<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    
    <linearGradient id="pathGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00c6ff"/>
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f093fb"/>
      <stop offset="100%" stop-color="#f5576c"/>
    </linearGradient>

    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="targetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0"/>
    </radialGradient>

    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="100" fill="url(#bgGlow)" stroke="#2a2d3d" stroke-width="4"/>

  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5">
    <line x1="96" y1="64" x2="96" y2="448" />
    <line x1="160" y1="64" x2="160" y2="448" />
    <line x1="224" y1="64" x2="224" y2="448" />
    <line x1="288" y1="64" x2="288" y2="448" />
    <line x1="352" y1="64" x2="352" y2="448" />
    <line x1="416" y1="64" x2="416" y2="448" />
    <line x1="64" y1="96" x2="448" y2="96" />
    <line x1="64" y1="160" x2="448" y2="160" />
    <line x1="64" y1="224" x2="448" y2="224" />
    <line x1="64" y1="288" x2="448" y2="288" />
    <line x1="64" y1="352" x2="448" y2="352" />
    <line x1="64" y1="416" x2="448" y2="416" />
  </g>

  <g stroke="#4facfe" stroke-opacity="0.2" stroke-width="2">
    <line x1="96" y1="416" x2="416" y2="416" stroke-dasharray="4,4"/>
    <line x1="96" y1="96" x2="96" y2="416" stroke-dasharray="4,4"/>
  </g>

  <g stroke="#64748b" stroke-width="2" stroke-dasharray="5,5" stroke-opacity="0.6">
    <line x1="120" y1="380" x2="180" y2="260" />
    <line x1="380" y1="140" x2="290" y2="120" />
  </g>

  <path d="M 120 380 C 180 260, 210 180, 290 280 C 340 340, 290 120, 380 140" 
        fill="none" stroke="#00f2fe" stroke-width="14" opacity="0.3" filter="url(#dropGlow)" stroke-linecap="round"/>
  <path d="M 120 380 C 180 260, 210 180, 290 280 C 340 340, 290 120, 380 140" 
        fill="none" stroke="url(#pathGradient)" stroke-width="7" stroke-linecap="round" filter="url(#dropGlow)"/>

  <line x1="290" y1="280" x2="340" y2="340" stroke="#f093fb" stroke-width="2" stroke-dasharray="3,3" opacity="0.7"/>

  <circle cx="120" cy="380" r="16" fill="url(#nodeGlow)"/>
  <circle cx="120" cy="380" r="8" fill="#0f172a" stroke="#00f2fe" stroke-width="4"/>

  <circle cx="180" cy="260" r="5" fill="#64748b"/>
  <circle cx="290" cy="120" r="5" fill="#64748b"/>

  <circle cx="290" cy="280" r="18" fill="url(#nodeGlow)"/>
  <circle cx="290" cy="280" r="9" fill="#0f172a" stroke="#f093fb" stroke-width="4"/>
  <circle cx="340" cy="340" r="5" fill="#f093fb"/>

  <circle cx="380" cy="140" r="28" fill="url(#targetGlow)"/>
  <circle cx="380" cy="140" r="12" fill="#0f172a" stroke="#ff007f" stroke-width="4" filter="url(#strongGlow)"/>

  <g transform="translate(380, 140) rotate(-25)">
    <polygon points="0,-22 10,12 0,6 -10,12" fill="#ff007f" filter="url(#dropGlow)"/>
  </g>

  <g transform="translate(64, 435)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="28" font-weight="900" letter-spacing="4" fill="#f8fafc" opacity="0.9">APA</text>
    <text x="92" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="14" font-weight="600" letter-spacing="2" fill="#4facfe" opacity="0.8">PATH ARCHITECT</text>
  </g>

  <circle cx="438" cy="74" r="6" fill="#10b981" filter="url(#dropGlow)"/>
</svg>
